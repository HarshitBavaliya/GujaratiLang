name: Cross-platform release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.platform }} release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-14
            platform: macos-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Windows
        if: matrix.platform == 'windows-x64'
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON

      - name: Configure Unix
        if: matrix.platform != 'windows-x64'
        run: cmake -S . -B build -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Stage Windows package
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, package\examples | Out-Null
          Copy-Item build\Release\gujarati.exe package\gujarati.exe
          Copy-Item examples\*.gj package\examples\
          Copy-Item release\README.txt package\README.txt
          Copy-Item release\install.ps1 package\install.ps1
          Copy-Item LICENSE package\LICENSE
          Compress-Archive -Path package\* -DestinationPath dist\gujaratilang-${{ matrix.platform }}.zip -Force

      - name: Stage Unix package
        if: matrix.platform != 'windows-x64'
        shell: bash
        run: |
          mkdir -p dist package/examples
          if [ -f build/Release/gujarati ]; then
            cp build/Release/gujarati package/gujarati
          else
            cp build/gujarati package/gujarati
          fi
          cp examples/*.gj package/examples/
          cp release/README.txt package/README.txt
          cp LICENSE package/LICENSE
          tar -czf "dist/gujaratilang-${{ matrix.platform }}.tar.gz" -C package .

      - name: Verify Windows package
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          Expand-Archive dist\gujaratilang-windows-x64.zip -DestinationPath package-test
          if (-not (Test-Path package-test\install.ps1)) {
            throw "The Windows package is missing install.ps1."
          }
          if (-not (Test-Path package-test\LICENSE)) {
            throw "The Windows package is missing LICENSE."
          }
          $process = Start-Process -FilePath package-test\gujarati.exe `
            -ArgumentList package-test\examples\hello.gj `
            -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput package-test\stdout.txt `
            -RedirectStandardError package-test\stderr.txt
          if ($process.ExitCode -ne 0) {
            Get-Content package-test\stderr.txt
            throw "The packaged GujaratiLang sample failed with exit code $($process.ExitCode)."
          }

      - name: Verify Unix package
        if: matrix.platform != 'windows-x64'
        shell: bash
        run: |
          mkdir package-test
          tar -xzf "dist/gujaratilang-${{ matrix.platform }}.tar.gz" -C package-test
          test -f package-test/LICENSE
          chmod +x package-test/gujarati
          ./package-test/gujarati ./package-test/examples/hello.gj

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gujaratilang-${{ matrix.platform }}
          path: dist/gujaratilang-${{ matrix.platform }}.*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: gujaratilang-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum gujaratilang-* > checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/gujaratilang-* dist/checksums.txt --repo "$GITHUB_REPOSITORY" --title "GujaratiLang $GITHUB_REF_NAME" --generate-notes
